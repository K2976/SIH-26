# Render Blueprint for the FitForge Django backend.
#
# Database: this app already runs against a managed Neon PostgreSQL
# instance (see fitforge/backend/.env / docs/PHONE_BACKEND_SETUP.md) —
# there is no Render-managed Postgres resource defined here. DATABASE_URL
# below is a plain env var you fill in with the Neon connection string
# from Render's dashboard, not a Render `databases:` block. This avoids
# running two Postgres instances and keeps prod/dev on the same data.
#
# No secret values live in this file — every credential below is
# `sync: false`, which makes Render prompt for the value once in the
# dashboard at Blueprint creation time instead of reading it from here.
services:
  - type: web
    name: fitforge-backend
    runtime: python
    rootDir: fitforge/backend
    # Free tier: spins down after 15 min with no inbound traffic; the next
    # request pays a ~30-50s cold start. See docs/DEPLOYMENT.md "Free-tier
    # cold starts" for the keep-alive workflow and the manual pre-demo
    # warm-up step that work around it — this is a deliberate free-tier
    # accommodation, not left over from a paid-plan setup.
    #
    # Free tier does NOT support preDeployCommand or Shell/SSH access
    # (confirmed against Render's docs), which is why migrate runs in
    # buildCommand below instead of as a separate pre-deploy step, and why
    # DEPLOYMENT.md's manual-migration fallback runs locally against
    # DATABASE_URL rather than through a Render shell.
    plan: free
    region: oregon
    branch: master

    # collectstatic is a build-time concern (writes to STATIC_ROOT on the
    # build filesystem); it does not touch the database. migrate runs here
    # too — free tier has no preDeployCommand, and free tier can't scale to
    # multiple instances anyway, so "once per deploy, not once per
    # instance" isn't a concern to design around here. migrate is
    # idempotent (a no-op when nothing's pending), so running it on every
    # build is safe.
    buildCommand: "pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn fitforge.wsgi:application --bind 0.0.0.0:$PORT"

    # Plain 200, no DB query — see fitforge/backend/fitforge/health.py.
    # A slow query elsewhere must not make Render think the service is down.
    # Also the endpoint the keep-alive workflow and manual warm-up ping.
    healthCheckPath: /healthz/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: fitforge.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.8

      # Secrets and per-environment values — set in Render's dashboard,
      # never here. See docs/DEPLOYMENT.md for the full list and what
      # each one is for.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
