openapi: 3.0.3
info:
  title: FitForge API
  version: 1.0.0
  description: Training, nutrition, and cycle data behind one adaptive engine.
paths:
  /api/v1/app-config/:
    get:
      operationId: app_config_retrieve
      tags:
      - app-config
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Takes a set of user credentials and returns an access and refresh JSON web

        token pair to prove the authentication of those credentials.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: 'TokenRefreshView with an accurate response schema.


        simplejwt''s own serializer only declares the request field; with

        ROTATE_REFRESH_TOKENS on, the response body also carries a new

        `refresh` token, which TokenPairSerializer already models.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/cycle/data/:
    get:
      operationId: cycle_data_retrieve
      description: |-
        GET: full export of every cycle-module row the user owns.
        DELETE: full, irreversible delete of every cycle-module row.

        Both requirements from §10: "Full export and full delete are
        requirements." Nothing here is partial — every CycleLog row (including
        ones superseded by a correction) is included/removed, since a
        superseded row is still cycle data sitting on the server.
      tags:
      - cycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleExport'
          description: ''
    delete:
      operationId: cycle_data_destroy
      description: |-
        GET: full export of every cycle-module row the user owns.
        DELETE: full, irreversible delete of every cycle-module row.

        Both requirements from §10: "Full export and full delete are
        requirements." Nothing here is partial — every CycleLog row (including
        ones superseded by a correction) is included/removed, since a
        superseded row is still cycle data sitting on the server.
      tags:
      - cycle
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cycle/profile/:
    get:
      operationId: cycle_profile_retrieve
      description: |-
        Tracking mode and self-reported cycle-length settings. Never inferred
        — set only by a direct question in onboarding/settings (§10).
      tags:
      - cycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleProfile'
          description: ''
    put:
      operationId: cycle_profile_update
      description: |-
        Tracking mode and self-reported cycle-length settings. Never inferred
        — set only by a direct question in onboarding/settings (§10).
      tags:
      - cycle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CycleProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CycleProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleProfile'
          description: ''
    patch:
      operationId: cycle_profile_partial_update
      description: |-
        Tracking mode and self-reported cycle-length settings. Never inferred
        — set only by a direct question in onboarding/settings (§10).
      tags:
      - cycle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCycleProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCycleProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCycleProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleProfile'
          description: ''
  /api/v1/goal/:
    get:
      operationId: goal_retrieve
      tags:
      - goal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
    post:
      operationId: goal_create
      tags:
      - goal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Goal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Goal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Goal'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
  /api/v1/profile/:
    get:
      operationId: profile_retrieve
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: profile_update
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: profile_partial_update
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/reference/exercises/:
    get:
      operationId: reference_exercises_list
      parameters:
      - in: query
        name: since
        schema:
          type: integer
        description: Return rows changed after this reference_version. Default 0.
      tags:
      - reference
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercise'
          description: ''
  /api/v1/reference/manifest/:
    get:
      operationId: reference_manifest_retrieve
      tags:
      - reference
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
          description: ''
  /api/v1/state/:
    get:
      operationId: state_retrieve
      tags:
      - state
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserState'
          description: ''
  /api/v1/sync/:
    post:
      operationId: sync_create
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
  /api/v1/social/profile/:
    get:
      operationId: social_my_profile_retrieve
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
    post:
      operationId: social_my_profile_create
      tags:
      - social
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialProfileCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
    patch:
      operationId: social_my_profile_partial_update
      tags:
      - social
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialProfileUpdate'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/profile/{username}/:
    get:
      operationId: social_user_profile_retrieve
      tags:
      - social
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
        description: Unique public handle
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/search/:
    get:
      operationId: social_search_users
      tags:
      - social
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
        description: Search query
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/check-username/:
    get:
      operationId: social_check_username
      tags:
      - social
      parameters:
      - in: query
        name: username
        required: true
        schema:
          type: string
        description: Candidate username to check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheckResponse'
          description: ''
  /api/v1/social/communities/:
    get:
      operationId: social_communities_list
      tags:
      - community
      parameters:
      - in: query
        name: filter
        required: false
        schema:
          type: string
          default: discover
        description: Filter options
      - in: query
        name: search
        required: false
        schema:
          type: string
        description: Search keyword
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityList'
          description: ''
    post:
      operationId: social_communities_create
      tags:
      - community
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
  /api/v1/social/communities/{id}/:
    get:
      operationId: social_communities_retrieve
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
    patch:
      operationId: social_communities_partial_update
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommunityUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
    delete:
      operationId: social_communities_destroy
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
  /api/v1/social/communities/{id}/members/:
    get:
      operationId: social_communities_members_list
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityMember'
          description: ''
  /api/v1/social/communities/{id}/join/:
    post:
      operationId: social_communities_join_create
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMember'
          description: ''
  /api/v1/social/communities/{id}/leave/:
    post:
      operationId: social_communities_leave_create
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: ''
components:
  schemas:
    AppConfig:
      type: object
      properties:
        min_supported_version:
          type: string
      required:
      - min_supported_version
    EmailTokenObtainPair:
      type: object
      description: Login by email instead of username, on top of the default User model.
      properties:
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
      required:
      - email
      - password
    EnergyDirectionEnum:
      enum:
      - cut
      - maintain
      - gain
      - not_tracking
      type: string
      description: '* `cut` - Cut

        * `maintain` - Maintain

        * `gain` - Gain

        * `not_tracking` - Not tracking'
    Exercise:
      type: object
      properties:
        slug:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name: {}
        instructions: {}
        primary_muscles: {}
        secondary_muscles: {}
        equipment:
          type: string
          maxLength: 64
        movement_pattern:
          $ref: '#/components/schemas/MovementPatternEnum'
        form_cues: {}
        met_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
        is_bodyweight:
          type: boolean
        pose_config:
          nullable: true
        camera_position:
          type: string
          nullable: true
          enum:
          - front
          - side
          - 45_degree
        is_active:
          type: boolean
        updated_at_version:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - instructions
      - met_value
      - movement_pattern
      - name
      - slug
    Goal:
      type: object
      properties:
        energy_direction:
          $ref: '#/components/schemas/EnergyDirectionEnum'
        training_focus:
          $ref: '#/components/schemas/TrainingFocusEnum'
        target_rate_kg_per_week:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        auto_adjust:
          type: boolean
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        clamp_reason:
          type: string
          nullable: true
          readOnly: true
      required:
      - clamp_reason
      - ended_at
      - energy_direction
      - started_at
      - training_focus
    Manifest:
      type: object
      properties:
        reference_version:
          type: integer
        table_counts:
          type: object
          additionalProperties:
            type: integer
      required:
      - reference_version
      - table_counts
    MovementPatternEnum:
      enum:
      - squat
      - hinge
      - lunge
      - push_horizontal
      - push_vertical
      - pull_horizontal
      - pull_vertical
      - carry
      - core
      - isolation
      - plyometric
      - cardio
      type: string
      description: '* `squat` - Squat

        * `hinge` - Hinge

        * `lunge` - Lunge

        * `push_horizontal` - Push (horizontal)

        * `push_vertical` - Push (vertical)

        * `pull_horizontal` - Pull (horizontal)

        * `pull_vertical` - Pull (vertical)

        * `carry` - Carry

        * `core` - Core

        * `isolation` - Isolation

        * `plyometric` - Plyometric

        * `cardio` - Cardio'
    PatchedUserProfile:
      type: object
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
          enum:
          - male
          - female
          - intersex
        height_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        current_weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        waist_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        resting_hr:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        timezone:
          type: string
          maxLength: 64
        unit_preference:
          $ref: '#/components/schemas/UnitPreferenceEnum'
        activity_level:
          type: string
          nullable: true
          enum:
          - sedentary
          - lightly_active
          - moderately_active
          - very_active
          - extra_active
        tracks_cycle:
          type: boolean
          nullable: true
        declined_fields: {}
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        field_states:
          type: object
          additionalProperties:
            type: string
          readOnly: true
    Signup:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    SyncError:
      type: object
      properties:
        index:
          type: integer
        client_uuid:
          type: string
          nullable: true
        error:
          type: string
      required:
      - client_uuid
      - error
      - index
    SyncEvent:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        client_uuid:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        utc_offset:
          type: string
          default: +00:00
        source:
          type: string
          default: manual
        supersedes:
          type: string
          format: uuid
          nullable: true
        planned_session:
          type: string
          format: uuid
          nullable: true
        duration_minutes:
          type: integer
          nullable: true
        notes:
          type: string
        session:
          type: string
          format: uuid
          nullable: true
        exercise:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        set_index:
          type: integer
        reps:
          type: integer
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        rpe:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        is_warmup:
          type: boolean
          default: false
        rom_achieved:
          type: string
          nullable: true
        tempo_ms:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        event:
          type: string
        flow:
          type: string
        symptoms:
          type: array
          items:
            type: string
        energy_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
      required:
      - client_uuid
      - occurred_at
      - type
    SyncRequest:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEvent'
      required:
      - events
    SyncResponse:
      type: object
      properties:
        success_count:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SyncError'
      required:
      - errors
      - success_count
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TrainingFocusEnum:
      enum:
      - strength
      - hypertrophy
      - endurance
      - general
      type: string
      description: '* `strength` - Strength

        * `hypertrophy` - Hypertrophy

        * `endurance` - Endurance

        * `general` - General'
    TypeEnum:
      enum:
      - planned_session
      - workout_session
      - set_log
      - meal_log
      - meal_item
      - weight_log
      - sleep_log
      - cycle_log
      type: string
      description: '* `planned_session` - planned_session

        * `workout_session` - workout_session

        * `set_log` - set_log

        * `meal_log` - meal_log

        * `meal_item` - meal_item

        * `weight_log` - weight_log

        * `sleep_log` - sleep_log

        * `cycle_log` - cycle_log'
    UnitPreferenceEnum:
      enum:
      - metric
      - imperial
      type: string
      description: '* `metric` - Metric

        * `imperial` - Imperial'
    UserProfile:
      type: object
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
          enum:
          - male
          - female
          - intersex
        height_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        current_weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        waist_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        resting_hr:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        timezone:
          type: string
          maxLength: 64
        unit_preference:
          $ref: '#/components/schemas/UnitPreferenceEnum'
        activity_level:
          type: string
          nullable: true
          enum:
          - sedentary
          - lightly_active
          - moderately_active
          - very_active
          - extra_active
        tracks_cycle:
          type: boolean
          nullable: true
        declined_fields: {}
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        field_states:
          type: object
          additionalProperties:
            type: string
          readOnly: true
      required:
      - field_states
    BodyState:
      type: object
      properties:
        latest_weight_kg:
          type: number
          format: double
          nullable: true
        weight_trend_kg_per_week:
          type: number
          format: double
          nullable: true
        trend_confidence:
          type: number
          format: double
          nullable: true
        fitness_age:
          type: number
          format: double
          nullable: true
        fitness_age_inputs:
          nullable: true
      required:
      - fitness_age
      - fitness_age_inputs
      - latest_weight_kg
      - trend_confidence
      - weight_trend_kg_per_week
    CycleState:
      type: object
      properties:
        enabled:
          type: boolean
        tracking_mode:
          type: string
          nullable: true
        phase:
          type: string
          nullable: true
        cycle_day:
          type: integer
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
        days_until_predicted_period:
          type: integer
          nullable: true
        learned_pattern:
          allOf:
          - $ref: '#/components/schemas/LearnedPatternState'
          nullable: true
        energy_availability_flag:
          type: string
          nullable: true
      required:
      - confidence
      - cycle_day
      - days_until_predicted_period
      - enabled
      - energy_availability_flag
      - learned_pattern
      - phase
      - tracking_mode
    LearnedPatternState:
      type: object
      description: |-
        Summary only — sample size and confidence, per §10 ("surface it with
        sample size and confidence attached"). The full per-cycle-day breakdown
        is CyclePatternExportSerializer, reachable via GET /api/v1/cycle/data/.
        Deliberately not a JSONField: a typed schema here means a typed,
        directly-usable Kotlin model instead of an untyped JSON blob.
      properties:
        sample_cycles:
          type: integer
        confidence:
          type: number
          format: double
      required:
      - confidence
      - sample_cycles
    EnergyState:
      type: object
      properties:
        maintenance_kcal:
          type: number
          format: double
          nullable: true
        maintenance_source:
          type: string
          nullable: true
        maintenance_confidence:
          type: number
          format: double
          nullable: true
        target_kcal_today:
          type: number
          format: double
          nullable: true
        consumed_kcal_today:
          type: number
          format: double
          nullable: true
        consumed_kcal_today_partial:
          type: boolean
        burned_kcal_today:
          type: number
          format: double
          nullable: true
        burned_kcal_today_partial:
          type: boolean
        week_balance_kcal:
          type: number
          format: double
          nullable: true
        week_balance_kcal_partial:
          type: boolean
        data_sufficiency:
          type: string
      required:
      - burned_kcal_today
      - burned_kcal_today_partial
      - consumed_kcal_today
      - consumed_kcal_today_partial
      - data_sufficiency
      - maintenance_confidence
      - maintenance_kcal
      - maintenance_source
      - target_kcal_today
      - week_balance_kcal
      - week_balance_kcal_partial
    FlagsState:
      type: object
      properties:
        missing_food_days_7d:
          type: integer
        missing_weight_days_14d:
          type: integer
        goal_recently_changed:
          type: boolean
        insufficient_data_for_adaptation:
          type: boolean
      required:
      - goal_recently_changed
      - insufficient_data_for_adaptation
      - missing_food_days_7d
      - missing_weight_days_14d
    GoalState:
      type: object
      properties:
        energy_direction:
          type: string
          nullable: true
        training_focus:
          type: string
          nullable: true
        target_rate_kg_per_week:
          type: number
          format: double
          nullable: true
        auto_adjust:
          type: boolean
          nullable: true
      required:
      - auto_adjust
      - energy_direction
      - target_rate_kg_per_week
      - training_focus
    PlanDelta:
      type: object
      properties:
        target_kcal:
          type: number
          format: double
          nullable: true
        volume_today_kg:
          type: number
          format: double
          nullable: true
        readiness_ceiling:
          type: number
          format: double
          nullable: true
        dropped_sessions:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
        clamped_by:
          type: array
          items:
            type: string
      required:
      - dropped_sessions
      - readiness_ceiling
      - reason
      - target_kcal
      - volume_today_kg
    ProfileState:
      type: object
      properties:
        age:
          type: integer
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
        height_cm:
          type: number
          format: double
          nullable: true
        unit_preference:
          type: string
          nullable: true
        tracks_cycle:
          type: boolean
          nullable: true
        timezone:
          type: string
          nullable: true
      required:
      - age
      - height_cm
      - sex_at_birth
      - timezone
      - tracks_cycle
      - unit_preference
    TrainingState:
      type: object
      properties:
        week_volume_planned:
          type: number
          format: double
          nullable: true
        week_volume_planned_partial:
          type: boolean
        week_volume_completed:
          type: number
          format: double
          nullable: true
        week_volume_completed_partial:
          type: boolean
        volume_by_muscle_group:
          type: object
          additionalProperties:
            type: number
            format: double
          nullable: true
        volume_by_muscle_group_partial:
          type: boolean
        adherence_7d:
          type: number
          format: double
          nullable: true
        adherence_7d_partial:
          type: boolean
        readiness_ceiling_today:
          type: number
          format: double
          nullable: true
        days_since_rest:
          type: integer
          nullable: true
        days_since_rest_partial:
          type: boolean
      required:
      - adherence_7d
      - adherence_7d_partial
      - days_since_rest
      - days_since_rest_partial
      - readiness_ceiling_today
      - volume_by_muscle_group
      - volume_by_muscle_group_partial
      - week_volume_completed
      - week_volume_completed_partial
      - week_volume_planned
      - week_volume_planned_partial
    UserState:
      type: object
      properties:
        as_of:
          type: string
          format: date
        profile:
          $ref: '#/components/schemas/ProfileState'
        goal:
          $ref: '#/components/schemas/GoalState'
        energy:
          $ref: '#/components/schemas/EnergyState'
        training:
          $ref: '#/components/schemas/TrainingState'
        plan_delta:
          allOf:
          - $ref: '#/components/schemas/PlanDelta'
          nullable: true
        body:
          $ref: '#/components/schemas/BodyState'
        cycle:
          $ref: '#/components/schemas/CycleState'
        flags:
          $ref: '#/components/schemas/FlagsState'
      required:
      - as_of
      - body
      - cycle
      - energy
      - flags
      - goal
      - plan_delta
      - profile
      - training
    SocialProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        profile_image:
          type: string
          nullable: true
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - username
      - display_name
      - bio
      - is_private
      - created_at
      - updated_at
    CommunityList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        members_count:
          type: integer
        current_user_role:
          type: string
          nullable: true
        is_member:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - visibility
      - members_count
      - is_member
      - created_at
    CommunityCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
