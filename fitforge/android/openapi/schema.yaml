          description: ''
  /api/v1/social/check-username/:
    get:
      operationId: social_check_username_retrieve
      description: Check whether a social username is valid and available.
      summary: Check username availability
      parameters:
      - in: query
        name: username
        schema:
          type: string
        description: Candidate public handle to check
      tags:
      - social
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheckResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheckResponse'
          description: ''
  /api/v1/social/communities/:
    get:
      operationId: social_communities_list
      description: List and create fitness communities.
      summary: List communities
      parameters:
      - in: query
        name: filter
        schema:
          type: string
          default: discover
        description: 'Filter options: ''my'' (joined communities) or ''discover''
          (public communities)'
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword for community name or description
      tags:
      - community
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityList'
          description: ''
    post:
      operationId: social_communities_create
      description: List and create fitness communities.
      summary: Create a new community
      tags:
      - community
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommunityCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommunityCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/social/communities/{id}/:
    get:
      operationId: social_communities_retrieve
      description: Retrieve, update, or delete a specific community.
      summary: Retrieve community details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - community
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: social_communities_update
      description: Retrieve, update, or delete a specific community.
      summary: Replace community details (owner/admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - community
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommunityUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommunityUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: social_communities_partial_update
      description: Retrieve, update, or delete a specific community.
      summary: Update community details (owner/admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - community
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommunityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommunityUpdate'
