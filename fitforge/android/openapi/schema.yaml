openapi: 3.0.3
info:
  title: FitForge API
  version: 1.0.0
  description: Training, nutrition, and cycle data behind one adaptive engine.
paths:
  /api/v1/app-config/:
    get:
      operationId: app_config_retrieve
      tags:
      - app-config
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        TokenRefreshView with an accurate response schema.

        simplejwt's own serializer only declares the request field; with
        ROTATE_REFRESH_TOKENS on, the response body also carries a new
        `refresh` token, which TokenPairSerializer already models.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/cycle/data/:
    get:
      operationId: cycle_data_retrieve
      description: |-
        GET: full export of every cycle-module row the user owns.
        DELETE: full, irreversible delete of every cycle-module row.

        Both requirements from §10: "Full export and full delete are
        requirements." Nothing here is partial — every CycleLog row (including
        ones superseded by a correction) is included/removed, since a
        superseded row is still cycle data sitting on the server.
      tags:
      - cycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleExport'
          description: ''
    delete:
      operationId: cycle_data_destroy
      description: |-
        GET: full export of every cycle-module row the user owns.
        DELETE: full, irreversible delete of every cycle-module row.

        Both requirements from §10: "Full export and full delete are
        requirements." Nothing here is partial — every CycleLog row (including
        ones superseded by a correction) is included/removed, since a
        superseded row is still cycle data sitting on the server.
      tags:
      - cycle
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cycle/profile/:
    get:
      operationId: cycle_profile_retrieve
      description: |-
        Tracking mode and self-reported cycle-length settings. Never inferred
        — set only by a direct question in onboarding/settings (§10).
      tags:
      - cycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleProfile'
          description: ''
    put:
      operationId: cycle_profile_update
      description: |-
        Tracking mode and self-reported cycle-length settings. Never inferred
        — set only by a direct question in onboarding/settings (§10).
      tags:
      - cycle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CycleProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CycleProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleProfile'
          description: ''
    patch:
      operationId: cycle_profile_partial_update
      description: |-
        Tracking mode and self-reported cycle-length settings. Never inferred
        — set only by a direct question in onboarding/settings (§10).
      tags:
      - cycle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCycleProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCycleProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCycleProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleProfile'
          description: ''
  /api/v1/goal/:
    get:
      operationId: goal_retrieve
      tags:
      - goal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
    post:
      operationId: goal_create
      tags:
      - goal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Goal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Goal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Goal'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
  /api/v1/profile/:
    get:
      operationId: profile_retrieve
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: profile_update
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: profile_partial_update
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/reference/exercises/:
    get:
      operationId: reference_exercises_list
      parameters:
      - in: query
        name: since
        schema:
          type: integer
        description: Return rows changed after this reference_version. Default 0.
      tags:
      - reference
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
