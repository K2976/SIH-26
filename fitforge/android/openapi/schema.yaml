        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
      required:
      - name
    SocialProfileCreate:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_private:
          type: boolean
      required:
      - username
      - display_name
    UsernameCheckResponse:
      type: object
      properties:
