# Snapshot of the backend's OpenAPI schema, checked in so the Retrofit
# client can be generated at build time without a running backend.
# Trimmed to avoid the known openapi-generator kotlin-client bug with
# BlankEnum/NullEnum nullable-enum fields — nullable enums are typed as
# plain strings here. Regenerate in full and re-trim when needed:
#   cd backend && python manage.py spectacular --file ../android/openapi/schema.yaml
openapi: 3.0.3
info:
  title: FitForge API
  version: 1.0.0
  description: Training, nutrition, and cycle data behind one adaptive engine.
paths:
  /api/v1/app-config/:
    get:
      operationId: app_config_retrieve
      tags:
      - app-config
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Takes a set of user credentials and returns an access and refresh
        JSON web

        token pair to prove the authentication of those credentials.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: 'TokenRefreshView with an accurate response schema.


        simplejwt''s own serializer only declares the request field; with

        ROTATE_REFRESH_TOKENS on, the response body also carries a new

        `refresh` token, which TokenPairSerializer already models.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/profile/:
    get:
      operationId: profile_retrieve
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: profile_partial_update
      tags:
      - profile
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/goal/:
    get:
      operationId: goal_retrieve
      tags:
      - goal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
    post:
      operationId: goal_create
      tags:
      - goal
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
  /api/v1/social/profile/:
    get:
      operationId: social_my_profile_retrieve
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
    post:
      operationId: social_my_profile_create
      tags:
      - social
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialProfileCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
    patch:
      operationId: social_my_profile_partial_update
      tags:
      - social
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialProfileUpdate'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/profile/{username}/:
    get:
      operationId: social_user_profile_retrieve
      tags:
      - social
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
        description: Unique public handle
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/search/:
    get:
      operationId: social_search_users
      tags:
      - social
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
        description: Search query
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/check-username/:
    get:
      operationId: social_check_username
      tags:
      - social
      parameters:
      - in: query
        name: username
        required: true
        schema:
          type: string
        description: Candidate username to check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheckResponse'
          description: ''
components:
  schemas:
    AppConfig:
      type: object
      properties:
        min_supported_version:
          type: string
      required:
      - min_supported_version
    EmailTokenObtainPair:
      type: object
      description: Login by email instead of username, on top of the default User
        model.
      properties:
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
      required:
      - email
      - password
    Signup:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfile:
      type: object
      description: User profile with three-state optional fields.
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
          enum:
          - male
          - female
          - intersex
        height_cm:
          type: string
          nullable: true
        current_weight_kg:
          type: string
          nullable: true
        waist_cm:
          type: string
          nullable: true
        resting_hr:
          type: integer
          nullable: true
        timezone:
          type: string
        unit_preference:
          type: string
          enum:
          - metric
          - imperial
        activity_level:
          type: string
          nullable: true
          enum:
          - sedentary
          - lightly_active
          - moderately_active
          - very_active
          - extra_active
        tracks_cycle:
          type: boolean
          nullable: true
        declined_fields:
          type: array
          items:
            type: string
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        field_states:
          type: object
          additionalProperties:
            type: string
          readOnly: true
    PatchedUserProfile:
      type: object
      description: Partial update for UserProfile — all fields optional.
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
        height_cm:
          type: string
          nullable: true
        current_weight_kg:
          type: string
          nullable: true
        waist_cm:
          type: string
          nullable: true
        resting_hr:
          type: integer
          nullable: true
        timezone:
          type: string
        unit_preference:
          type: string
        activity_level:
          type: string
          nullable: true
        tracks_cycle:
          type: boolean
          nullable: true
        declined_fields:
          type: array
          items:
            type: string
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
    Goal:
      type: object
      properties:
        energy_direction:
          type: string
          enum:
          - cut
          - maintain
          - gain
          - not_tracking
        training_focus:
          type: string
          enum:
          - strength
          - hypertrophy
          - endurance
          - general
        target_rate_kg_per_week:
          type: string
        auto_adjust:
          type: boolean
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        clamp_reason:
          type: string
          nullable: true
          readOnly: true
    GoalRequest:
      type: object
      properties:
        energy_direction:
          type: string
          enum:
          - cut
          - maintain
          - gain
          - not_tracking
        training_focus:
          type: string
          enum:
          - strength
          - hypertrophy
          - endurance
          - general
        target_rate_kg_per_week:
          type: string
        auto_adjust:
          type: boolean
      required:
      - energy_direction
      - training_focus
      - target_rate_kg_per_week
      - auto_adjust
    SocialProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        profile_image:
          type: string
          nullable: true
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - username
      - display_name
      - bio
      - is_private
      - created_at
      - updated_at
    SocialProfileCreate:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_private:
          type: boolean
      required:
      - username
      - display_name
    SocialProfileUpdate:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_private:
          type: boolean
    UsernameCheckResponse:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
        message:
          type: string
      required:
      - available
      - message
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
