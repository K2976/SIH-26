                $ref: '#/components/schemas/CommunityDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: social_communities_destroy
      description: Retrieve, update, or delete a specific community.
      summary: Delete community (owner only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - community
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
