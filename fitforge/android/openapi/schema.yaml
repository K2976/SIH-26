      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/social/search/:
    get:
      operationId: social_search_list
      description: Search for users by username or display name.
      summary: Search social profiles
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search term (matches username or display name)
      tags:
      - social
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/state/:
    get:
      operationId: state_retrieve
      tags:
      - state
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserState'
          description: ''
  /api/v1/sync/:
    post:
      operationId: sync_create
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
components:
  schemas:
    AppConfig:
      type: object
      properties:
        min_supported_version:
          type: string
      required:
      - min_supported_version
    BodyState:
      type: object
      properties:
        latest_weight_kg:
          type: number
          format: double
          nullable: true
        weight_trend_kg_per_week:
          type: number
          format: double
          nullable: true
        trend_confidence:
          type: number
          format: double
          nullable: true
        fitness_age:
          type: number
          format: double
          nullable: true
        fitness_age_inputs:
          type: object
          nullable: true
      required:
      - fitness_age
      - fitness_age_inputs
      - latest_weight_kg
      - trend_confidence
      - weight_trend_kg_per_week
    CommunityCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 2
        description:
          type: string
          default: ''
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          default: public
      required:
      - name
    CommunityDetail:
      type: object
      description: Full detail serializer for a community.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/CommunityMemberUser'
          readOnly: true
        members_count:
          type: integer
          readOnly: true
        current_user_role:
          type: string
          nullable: true
          readOnly: true
        is_member:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
