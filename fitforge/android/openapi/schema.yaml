    SocialProfile:
      type: object
      description: |-
        Serializer for reading social profiles.

        Every usage is `SocialProfileSerializer(instance).data` — never used to
        validate a write. `bio` and `is_private` have model-level defaults
        (blank="", False) so ModelSerializer marks them not-required for
        writes, which drf-spectacular reflects by omitting them from the
        response schema's `required` list too — even though a read response
        always includes them. That made the generated Kotlin fields nullable
        (`String?`, `Boolean?`) when they're actually always present, forcing
        every consumer to null-check values that can't be null. Declaring the
        whole serializer read-only fixes the schema to match reality.
        `profile_image` is genuinely nullable (model field has null=True) and
        deliberately excluded here.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Public unique @handle (e.g. iron_lifter99)
          pattern: ^[a-zA-Z0-9_]{3,32}$
          maxLength: 32
        display_name:
          type: string
          maxLength: 64
        bio:
          type: string
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
        is_private:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bio
      - created_at
      - display_name
      - id
      - is_private
      - updated_at
      - username
    SocialProfileCreate:
      type: object
      description: Serializer for creating a new social profile for the authenticated
        user.
      properties:
        username:
          type: string
          description: Unique public handle (3-32 alphanumeric characters and underscores).
          maxLength: 32
          minLength: 3
        display_name:
          type: string
          maxLength: 64
        bio:
          type: string
          default: ''
        profile_image:
