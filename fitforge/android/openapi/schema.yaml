# Snapshot of the backend's OpenAPI schema, checked in so the Retrofit
# client can be generated at build time without a running backend.
# Trimmed to avoid the known openapi-generator kotlin-client bug with
# BlankEnum/NullEnum nullable-enum fields — nullable enums are typed as
# plain strings here. Regenerate in full and re-trim when needed:
#   cd backend && python manage.py spectacular --file ../android/openapi/schema.yaml
openapi: 3.0.3
info:
  title: FitForge API
  version: 1.0.0
  description: Training, nutrition, and cycle data behind one adaptive engine.
paths:
  /api/v1/app-config/:
    get:
      operationId: app_config_retrieve
      tags:
      - app-config
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Takes a set of user credentials and returns an access and refresh
        JSON web

        token pair to prove the authentication of those credentials.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: 'TokenRefreshView with an accurate response schema.


        simplejwt''s own serializer only declares the request field; with

        ROTATE_REFRESH_TOKENS on, the response body also carries a new

        `refresh` token, which TokenPairSerializer already models.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/profile/:
    get:
      operationId: profile_retrieve
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: profile_partial_update
      tags:
      - profile
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/goal/:
    get:
      operationId: goal_retrieve
      tags:
      - goal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
    post:
      operationId: goal_create
      tags:
      - goal
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
  /api/v1/social/profile/:
    get:
      operationId: social_my_profile_retrieve
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
    post:
      operationId: social_my_profile_create
      tags:
      - social
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialProfileCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
    patch:
      operationId: social_my_profile_partial_update
      tags:
      - social
      security:
      - jwtAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialProfileUpdate'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/profile/{username}/:
    get:
      operationId: social_user_profile_retrieve
      tags:
      - social
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
        description: Unique public handle
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/search/:
    get:
      operationId: social_search_users
      tags:
      - social
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
        description: Search query
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialProfile'
          description: ''
  /api/v1/social/check-username/:
    get:
      operationId: social_check_username
      tags:
      - social
      parameters:
      - in: query
        name: username
        required: true
        schema:
          type: string
        description: Candidate username to check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheckResponse'
          description: ''
  /api/v1/social/communities/:
    get:
      operationId: social_communities_list
      tags:
      - community
      parameters:
      - in: query
        name: filter
        required: false
        schema:
          type: string
          default: discover
        description: Filter options
      - in: query
        name: search
        required: false
        schema:
          type: string
        description: Search keyword
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityList'
          description: ''
    post:
      operationId: social_communities_create
      tags:
      - community
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
  /api/v1/social/communities/{id}/:
    get:
      operationId: social_communities_retrieve
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
    patch:
      operationId: social_communities_partial_update
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommunityUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDetail'
          description: ''
    delete:
      operationId: social_communities_destroy
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
  /api/v1/social/communities/{id}/members/:
    get:
      operationId: social_communities_members_list
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityMember'
          description: ''
  /api/v1/social/communities/{id}/join/:
    post:
      operationId: social_communities_join_create
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMember'
          description: ''
  /api/v1/social/communities/{id}/leave/:
    post:
      operationId: social_communities_leave_create
      tags:
      - community
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: ''
  /api/v1/social/communities/{community_pk}/challenges/:
    get:
      operationId: social_communities_challenges_list
      tags:
      - challenge
      parameters:
      - in: path
        name: community_pk
        required: true
        schema:
          type: integer
      - in: query
        name: status
        required: false
        schema:
          type: string
        description: Filter by status
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChallengeList'
          description: ''
    post:
      operationId: social_communities_challenges_create
      tags:
      - challenge
      parameters:
      - in: path
        name: community_pk
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDetail'
          description: ''
  /api/v1/social/communities/{community_pk}/challenges/{id}/:
    get:
      operationId: social_communities_challenges_retrieve
      tags:
      - challenge
      parameters:
      - in: path
        name: community_pk
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDetail'
          description: ''
    delete:
      operationId: social_communities_challenges_destroy
      tags:
      - challenge
      parameters:
      - in: path
        name: community_pk
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
  /api/v1/social/communities/{community_pk}/challenges/{id}/join/:
    post:
      operationId: social_communities_challenges_join_create
      tags:
      - challenge
      parameters:
      - in: path
        name: community_pk
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeParticipant'
          description: ''
  /api/v1/social/communities/{community_pk}/challenges/{id}/leave/:
    post:
      operationId: social_communities_challenges_leave_create
      tags:
      - challenge
      parameters:
      - in: path
        name: community_pk
        required: true
        schema:
          type: integer
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: ''
components:
  schemas:
    AppConfig:
      type: object
      properties:
        min_supported_version:
          type: string
      required:
      - min_supported_version
    EmailTokenObtainPair:
      type: object
      description: Login by email instead of username, on top of the default User
        model.
      properties:
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
      required:
      - email
      - password
    Signup:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfile:
      type: object
      description: User profile with three-state optional fields.
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
          enum:
          - male
          - female
          - intersex
        height_cm:
          type: string
          nullable: true
        current_weight_kg:
          type: string
          nullable: true
        waist_cm:
          type: string
          nullable: true
        resting_hr:
          type: integer
          nullable: true
        timezone:
          type: string
        unit_preference:
          type: string
          enum:
          - metric
          - imperial
        activity_level:
          type: string
          nullable: true
          enum:
          - sedentary
          - lightly_active
          - moderately_active
          - very_active
          - extra_active
        tracks_cycle:
          type: boolean
          nullable: true
        declined_fields:
          type: array
          items:
            type: string
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        field_states:
          type: object
          additionalProperties:
            type: string
          readOnly: true
    PatchedUserProfile:
      type: object
      description: Partial update for UserProfile — all fields optional.
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        sex_at_birth:
          type: string
          nullable: true
        height_cm:
          type: string
          nullable: true
        current_weight_kg:
          type: string
          nullable: true
        waist_cm:
          type: string
          nullable: true
        resting_hr:
          type: integer
          nullable: true
        timezone:
          type: string
        unit_preference:
          type: string
        activity_level:
          type: string
          nullable: true
        tracks_cycle:
          type: boolean
          nullable: true
        declined_fields:
          type: array
          items:
            type: string
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
    Goal:
      type: object
      properties:
        energy_direction:
          type: string
          enum:
          - cut
          - maintain
          - gain
          - not_tracking
        training_focus:
          type: string
          enum:
          - strength
          - hypertrophy
          - endurance
          - general
        target_rate_kg_per_week:
          type: string
        auto_adjust:
          type: boolean
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        clamp_reason:
          type: string
          nullable: true
          readOnly: true
    GoalRequest:
      type: object
      properties:
        energy_direction:
          type: string
          enum:
          - cut
          - maintain
          - gain
          - not_tracking
        training_focus:
          type: string
          enum:
          - strength
          - hypertrophy
          - endurance
          - general
        target_rate_kg_per_week:
          type: string
        auto_adjust:
          type: boolean
      required:
      - energy_direction
      - training_focus
      - target_rate_kg_per_week
      - auto_adjust
    SocialProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        profile_image:
          type: string
          nullable: true
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - username
      - display_name
      - bio
      - is_private
      - created_at
      - updated_at
    SocialProfileCreate:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_private:
          type: boolean
      required:
      - username
      - display_name
    SocialProfileUpdate:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_private:
          type: boolean
    UsernameCheckResponse:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
        message:
          type: string
      required:
      - available
      - message
    VisibilityEnum:
      enum:
      - public
      - private
      type: string
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      type: string
    CommunityMemberUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        profile_image:
          type: string
          nullable: true
        bio:
          type: string
      required:
      - id
      - username
      - display_name
      - bio
    CommunityMember:
      type: object
      properties:
        id:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
        joined_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/CommunityMemberUser'
      required:
      - id
      - role
      - joined_at
      - user
    CommunityList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        members_count:
          type: integer
        current_user_role:
          type: string
          nullable: true
        is_member:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - visibility
      - members_count
      - is_member
      - created_at
    CommunityDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        owner:
          $ref: '#/components/schemas/CommunityMemberUser'
        members_count:
          type: integer
        current_user_role:
          type: string
          nullable: true
        is_member:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - visibility
      - owner
      - members_count
      - is_member
      - created_at
      - updated_at
    CommunityCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          default: ''
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
      required:
      - name
    PatchedCommunityUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
    ChallengeTypeEnum:
      enum:
      - workout_count
      - workout_minutes
      - steps
      - calories_burned
      - distance_km
      type: string
    StatusEnum:
      enum:
      - upcoming
      - active
      - completed
      - cancelled
      type: string
    ChallengeList:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        challenge_type:
          $ref: '#/components/schemas/ChallengeTypeEnum'
        target_value:
          type: number
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        participants_count:
          type: integer
        created_by:
          $ref: '#/components/schemas/CommunityMemberUser'
        is_participant:
          type: boolean
      required:
      - id
      - title
      - challenge_type
      - target_value
      - start_date
      - end_date
      - status
      - participants_count
      - is_participant
    ChallengeDetail:
      type: object
      properties:
        id:
          type: integer
        community:
          type: integer
        title:
          type: string
        description:
          type: string
        challenge_type:
          $ref: '#/components/schemas/ChallengeTypeEnum'
        target_value:
          type: number
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_by:
          $ref: '#/components/schemas/CommunityMemberUser'
        participants_count:
          type: integer
        is_participant:
          type: boolean
        user_progress:
          $ref: '#/components/schemas/ChallengeProgress'
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeParticipant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - description
      - challenge_type
      - target_value
      - start_date
      - end_date
      - status
      - created_by
      - participants_count
      - is_participant
      - participants
      - created_at
      - updated_at
    ChallengeCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          default: ''
        challenge_type:
          $ref: '#/components/schemas/ChallengeTypeEnum'
        target_value:
          type: number
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
      required:
      - title
      - challenge_type
      - target_value
      - start_date
      - end_date
    ChallengeParticipant:
      type: object
      properties:
        id:
          type: integer
        user:
          $ref: '#/components/schemas/CommunityMemberUser'
        joined_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        progress:
          $ref: '#/components/schemas/ChallengeProgress'
          nullable: true
      required:
      - id
      - user
      - joined_at
    ChallengeProgress:
      type: object
      properties:
        current:
          type: number
        target:
          type: number
        percentage:
          type: number
        completed:
          type: boolean
      required:
      - current
      - target
      - percentage
      - completed
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT



