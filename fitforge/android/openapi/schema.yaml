          type: string
          nullable: true
        message:
          type: string
      required:
      - available
      - message
    PatchedCommunityUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
    CommunityDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        owner:
          $ref: '#/components/schemas/CommunityMemberUser'
        members_count:
          type: integer
        current_user_role:
          type: string
          nullable: true
        is_member:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - visibility
      - owner
      - members_count
      - is_member
      - created_at
      - updated_at
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      type: string
    CommunityMember:
      type: object
      properties:
        id:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
        joined_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/CommunityMemberUser'
      required:
      - id
      - role
      - joined_at
      - user
    VisibilityEnum:
      enum:
      - public
      - private
      type: string
    SocialProfileUpdate:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_private:
          type: boolean
    CommunityMemberUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        profile_image:
          type: string
          nullable: true
        bio:
          type: string
      required:
      - id
      - username
      - display_name
      - bio
    NullEnum:
      type: string
      enum:
      - 'null'
    CycleExport:
      type: object
      properties:
        profile:
          allOf:
          - $ref: '#/components/schemas/CycleProfile'
          nullable: true
        logs:
          type: array
          items:
            $ref: '#/components/schemas/CycleLogExport'
        learned_pattern:
          type: array
          items:
            $ref: '#/components/schemas/CyclePatternExport'
      required:
      - learned_pattern
      - logs
      - profile
    CycleLogExport:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        utc_offset:
          type: string
          maxLength: 6
        source:
          type: string
          maxLength: 32
        created_at:
          type: string
          format: date-time
          readOnly: true
        date:
          type: string
          format: date
        event:
          type: string
          maxLength: 32
        flow:
          type: string
          maxLength: 32
        symptoms: {}
        energy_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
      required:
      - client_uuid
      - created_at
      - date
      - occurred_at
      - source
      - utc_offset
    CyclePatternExport:
      type: object
      properties:
        cycle_day:
          type: integer
          maximum: 32767
          minimum: 0
        computed_at:
          type: string
          format: date-time
          readOnly: true
        avg_energy_rating:
          type: number
          format: double
          nullable: true
        symptom_frequency: {}
        avg_adherence:
          type: number
          format: double
          nullable: true
        avg_completed_volume_kg:
          type: number
          format: double
          nullable: true
        sample_cycles:
          type: integer
          maximum: 32767
          minimum: 0
        confidence:
          type: number
          format: double
      required:
      - computed_at
      - cycle_day
    CycleProfile:
      type: object
      properties:
        tracking_mode:
          $ref: '#/components/schemas/TrackingModeEnum'
        typical_length_days:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        typical_period_days:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
    PatchedCycleProfile:
      type: object
      properties:
        tracking_mode:
          $ref: '#/components/schemas/TrackingModeEnum'
        typical_length_days:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        typical_period_days:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
    TrackingModeEnum:
      enum:
      - natural
      - hormonal_contraception
      - pregnant
      - postpartum
      - perimenopause
      - not_cycling
      - unknown
      type: string
      description: |-
        * `natural` - Natural
        * `hormonal_contraception` - Hormonal contraception
        * `pregnant` - Pregnant
        * `postpartum` - Postpartum
        * `perimenopause` - Perimenopause
        * `not_cycling` - Not cycling
        * `unknown` - Unknown
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
